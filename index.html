<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Products Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Dog Store</h1>
        </div>
        <nav>
            <ul class="navbar">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                🛒 <span id="cart-count">0</span> items
            </div>
        </nav>
    </header>

    <section class="filter">
        <label for="category">Filter by Category:</label>
        <select id="category" onchange="filterProducts()">
            <option value="all">All</option>
            <option value="toys">Toys</option>
            <option value="food">Food</option>
            <option value="accessories">Accessories</option>
        </select>
    </section>

    <section class="product">
        <div class="product-item" data-category="toys">
            <img src="https://via.placeholder.com/200" alt="Dog Toy">
            <h3>Chew Toy</h3>
            <p>$10.00</p>
            <button class="add-to-cart" onclick="addToCart('Chew Toy', 10)">Add to Cart</button>
        </div>
        <div class="product-item" data-category="food">
            <img src="https://via.placeholder.com/200" alt="Dog Food">
            <h3>Premium Dog Food</h3>
            <p>$25.00</p>
            <button class="add-to-cart" onclick="addToCart('Premium Dog Food', 25)">Add to Cart</button>
        </div>
        <div class="product-item" data-category="accessories">
            <img src="https://via.placeholder.com/200" alt="Dog Collar">
            <h3>Leather Dog Collar</h3>
            <p>$15.00</p>
            <button class="add-to-cart" onclick="addToCart('Leather Dog Collar', 15)">Add to Cart</button>
        </div>
    </section>

    <div id="cart-popup" class="cart-popup">
        <h2>Your Cart</h2>
        <ul id="cart-list">
            <!-- Cart items will appear here -->
        </ul>
        <p>Total: $<span id="total-price">0</span></p>
        <button onclick="checkout()">Proceed to Checkout</button>
        <button onclick="closeCart()">Close</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
